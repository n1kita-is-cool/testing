<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Protected Page</title>
    <style>
        #protected-content {
            display: none;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        #login-box {
            padding: 20px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

    <div id="login-box">
        <h3>Enter Passcode</h3>
        <input type="password" id="pass-input" placeholder="Enter password">
        <button onclick="checkPassword()">Submit</button>
    </div>

    <div id="protected-content">
        <h1>Secret Page</h1>
        <p>This content is visible only after entering the correct passcode.</p>
    </div>

    <script>
        const correctPassword = "mySecretPassword123";

        function checkPassword() {
            const userInput = document.getElementById("pass-input").value;
            if (userInput === correctPassword) {
                document.getElementById("login-box").style.display = "none";
                document.getElementById("protected-content").style.display = "block";
            } else {
                alert("Incorrect passcode! Try again.");
            }
        }
    </script>

</body>
</html>
